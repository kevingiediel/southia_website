<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{site.title}}</title>
  <meta name="description" content="{{site.description}}">
  <link rel="canonical" href="{{site.url}}">
  <meta name="theme-color" content="#1C3322">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/montserrat-alt-500-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Southia">
  <meta property="og:title" content="{{site.title}}">
  <meta property="og:description" content="{{site.description}}">
  <meta property="og:url" content="{{site.url}}">
  <meta property="og:image" content="{{site.url}}og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{site.title}}">
  <meta name="twitter:description" content="{{site.description}}">
  <meta name="twitter:image" content="{{site.url}}og-image.jpg">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Southia","url":"{{site.url}}","email":"{{site.email}}","logo":"{{site.url}}apple-touch-icon.png","slogan":"Pessoas, dados e IA na mesma roda."}</script>
  <script>document.documentElement.classList.add('js');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('js-motion');</script>
  <script type="module" src="/src/js/main.js"></script>
</head>
<body data-smooth>
  {{> header}}
  <main>
    {{> hero}}
    {{> pessoas}}
    {{> solucoes}}
    {{> como}}
    {{> contato}}
  </main>
  {{> footer}}
</body>
</html>
